name: Release

# Pushing a version tag drafts a GitHub release:
#
#   git tag -a v0.1.0 -m "omnivar 0.1.0" && git push origin v0.1.0
#
# 1. The tag must match project(VERSION) in CMakeLists.txt (omnivar --version prints it).
# 2. The whole CI (ci.yml: lint with the Clang static analyzer, static build and Oncospan accuracy
#    gate, sanitizers) runs on the tagged commit.
# 3. The static x86_64 binary that CI built and benchmarked is packaged with LICENSE and
#    README.md, with SHA256SUMS, and a DRAFT release is created with notes generated by
#    `omnivar-testkit release-notes` (commits since the previous tag, checksums, benchmark).
#    Nothing is published: review the draft on GitHub (Releases), edit the notes, then publish.
#
# Re-running the workflow for the same tag (Actions -> Re-run) updates the draft; a published
# release is left alone.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: check tag
    runs-on: [self-hosted, linux, x64, omnivar]
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - id: v
        name: Tag matches project(VERSION)
        run: |
          tag="${{ github.ref_name }}"
          version=$(sed -n '/^project(omnivar/,/)/s/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "tag $tag, CMakeLists.txt VERSION $version"
          [ "$tag" = "v$version" ] || { echo "tag $tag does not match VERSION $version in CMakeLists.txt"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      analyzer: true   # the Clang static analyzer runs before every release, not on every push

  draft:
    name: draft release
    needs: [version, ci]
    runs-on: [self-hosted, linux, x64, omnivar]
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0  # the release notes need the history and the earlier tags
      - uses: actions/download-artifact@v4
        with:
          name: omnivar-linux-x86_64
          path: artifact
      - name: Package
        run: |
          chmod +x artifact/out/omnivar
          [ "$(artifact/out/omnivar --version | head -1 | cut -d, -f1)" = "omnivar ${TAG#v}" ] || { artifact/out/omnivar --version; exit 1; }
          name="omnivar-$TAG-linux-x86_64"
          rm -rf dist && mkdir -p "dist/$name"
          cp artifact/out/omnivar LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" --owner=0 --group=0 --sort=name "$name"
          (cd dist && sha256sum "$name.tar.gz" > SHA256SUMS && cat SHA256SUMS)
      - name: Release notes
        run: |
          cmake -S . -B build-tk -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
          cmake --build build-tk --target omnivar-testkit -j "$(nproc)"
          build-tk/tests/testkit/omnivar-testkit release-notes --tag "$TAG" --checksums dist/SHA256SUMS \
            --bench artifact/bench.txt --repo "${{ github.repository }}" \
            --build "$(artifact/out/omnivar --version | head -1), GCC 14 (Debian trixie), static glibc" > dist/notes.md
          cat dist/notes.md
      - name: Create or update the draft
        run: |
          assets=("dist/omnivar-$TAG-linux-x86_64.tar.gz" dist/SHA256SUMS)
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -q true; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --notes-file dist/notes.md
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG is already published; not changing it"; exit 1
          else
            gh release create "$TAG" "${assets[@]}" --draft --verify-tag --title "omnivar ${TAG#v}" --notes-file dist/notes.md
          fi
          echo "Draft: $(gh release view "$TAG" --json url --jq .url)"
