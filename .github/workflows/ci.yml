name: CI

# All jobs run on the self-hosted runner on the development workstation (labels: self-hosted,
# linux, x64, omnivar). The toolchain and the benchmark data are on that
# machine; jobs install nothing.
#
# Order (each job needs the one before; one runner, so they run one after another). The accuracy
# gate comes first so its result is known in about 3 minutes:
#   lint        repository rules (no Python, no upstream names in src/), clang-format, clang-tidy
#               (the Clang static analyzer only when called with analyzer: true, as release.yml does)
#   static      Debian trixie static x86_64 binary (Docker; runs the unit + golden gates inside).
#               Accuracy gate: the full Oncospan benchmark on that binary.
#   sanitizers  Clang 20 + libc++ ASan + UBSan: unit + golden gates, and an Oncospan subset;
#               Clang 19 TSan: the Oncospan subset with 8 threads. Both subset outputs must equal
#               the static binary's output byte for byte.
#
# Oncospan benchmark (omnivar-testkit bench): aardvark recall must stay 187/187 and the call set
# must equal tests/validation/oncospan_snapshot.tsv. The subset is every 10th target region.
# Data paths come from repository secrets (Settings -> Secrets and variables -> Actions ->
# Secrets, or `gh secret set`):
#   ONCOSPAN_DIR     directory with Oncospan_DNA.realigned.bam, target_roi_sorted_100bp_ex_pad.bed
#                    and oncospan_sorted_benchmark_variants.vcf.gz
#   REFERENCE_FASTA  the indexed hg38 FASTA
#
# Branch flow: feature branch -> test -> main. CI runs when changes are pushed to test (after a
# feature branch is merged into it), on manual runs (gh workflow run CI --ref <branch>) and from
# release.yml, which calls it for a v* tag before it builds and drafts the release. Feature
# branches, pull requests and main do not trigger it: main only receives commits that passed on
# test (fast-forward).

on:
  push:
    branches: [test]
  workflow_dispatch:
  workflow_call:
    inputs:
      analyzer:
        description: Also run the Clang static analyzer checks of .clang-tidy (about 1 minute more)
        type: boolean
        default: false

permissions:
  contents: read

# One runner: a newer push cancels the run still in progress on the same ref. (Called from
# release.yml, github.workflow is "Release", so release runs have their own group.)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Secrets, not variables: public logs then show the paths as ***.
  ONCOSPAN_DIR: ${{ secrets.ONCOSPAN_DIR }}
  REFERENCE_FASTA: ${{ secrets.REFERENCE_FASTA }}

jobs:
  lint:
    name: lint
    runs-on: [self-hosted, linux, x64, omnivar]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Repository rules
        run: |
          # Everything in this repository is C++ (tooling that must run the reference jar is Java,
          # the read-only reference scripts are R and Perl).
          if git ls-files '*.py' | grep .; then echo "Python files are not allowed (use tests/testkit)"; exit 1; fi
          # No "java" or "vardict" in the code: comments say "upstream" for the reference implementation.
          if git grep -n -i -E 'java|vardict' -- src tests/unit CMakeLists.txt cmake; then
            echo "the code must not name the reference implementation"; exit 1
          fi
      - name: clang-format
        run: git ls-files 'src/*.cpp' 'src/*.hpp' 'tests/unit/*.cpp' 'tests/testkit/*.cpp' 'tests/testkit/*.hpp' | xargs clang-format-20 --dry-run --Werror
      - name: Configure (Clang 19, libstdc++; compile_commands.json for clang-tidy)
        run: >
          cmake -S . -B build-lint -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-19 -DCMAKE_CXX_COMPILER=clang++-19 -DOMNIVAR_WERROR=ON
      - name: Build htslib (its headers; the version header is written by configure)
        run: cmake --build build-lint --target htslib_ext
      - name: clang-tidy${{ inputs.analyzer && ' (with the static analyzer)' || '' }}
        env:
          # The analyzer checks take two thirds of the time (realigner.cpp alone ~50 s).
          CHECKS: ${{ !inputs.analyzer && '--checks=-clang-analyzer-*' || '' }}
        run: |
          # clang-tidy directly: run-clang-tidy ignores the .clang-tidy checks when -checks is given.
          jq -r '.[].file' build-lint/compile_commands.json | grep -E "^$PWD/(src|tests/testkit)/" |
            xargs -P "$(nproc)" -n 1 clang-tidy-20 -p build-lint --quiet $CHECKS 2>&1 |
            sed -E "/^[0-9]+ warnings? generated\.$/d"   # counts of suppressed system-header warnings

  static:
    name: static / debian-trixie x86_64
    needs: lint
    runs-on: [self-hosted, linux, x64, omnivar]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the static binary (runs unit + golden gates inside, checks it is static)
        run: docker build -f docker/debian-static.Dockerfile --target export --output type=local,dest=out .
      - name: Check the binary
        run: |
          file out/omnivar
          ldd out/omnivar 2>&1 | grep "not a dynamic executable"
          out/omnivar --version
      - name: Build the testkit (host)
        run: |
          cmake -S . -B build-tk -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
          cmake --build build-tk --target omnivar-testkit -j "$(nproc)"
      - name: Accuracy gate (Oncospan benchmark on the static binary)
        run: |
          test -n "$ONCOSPAN_DIR" && test -n "$REFERENCE_FASTA" || { echo "set the ONCOSPAN_DIR and REFERENCE_FASTA repository secrets"; exit 1; }
          build-tk/tests/testkit/omnivar-testkit bench --binary out/omnivar --reference "$REFERENCE_FASTA" \
            --bed "$ONCOSPAN_DIR/target_roi_sorted_100bp_ex_pad.bed" -b "$ONCOSPAN_DIR/Oncospan_DNA.realigned.bam" \
            -N Oncospan_DNA --truth "$ONCOSPAN_DIR/oncospan_sorted_benchmark_variants.vcf.gz" \
            --snapshot tests/validation/oncospan_snapshot.tsv --min-recall 1 -th 16 -- -f 0.01 | tee bench.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: omnivar-linux-x86_64
          path: |
            out/omnivar
            bench.txt

  sanitizers:
    name: sanitizers / ${{ matrix.name }}
    needs: static
    runs-on: [self-hosted, linux, x64, omnivar]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: asan-ubsan
            cc: clang-20
            cxx: clang++-20
            flags: -stdlib=libc++
            cmake_args: -DOMNIVAR_SANITIZE=ON
            target: all
            threads: 16
          - name: tsan
            cc: clang-19
            cxx: clang++-19
            flags: -fsanitize=thread
            cmake_args: -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread
            target: omnivar
            threads: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Configure
        # -O1 with sanitizers finds the same bugs and runs much faster than -O0
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}" "-DCMAKE_C_FLAGS_RELWITHDEBINFO=-O1 -g"
          "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O1 -g" -DOMNIVAR_WERROR=ON ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build --target ${{ matrix.target }} -j "$(nproc)"
      - name: Unit and golden gates (ASan + UBSan)
        if: matrix.name == 'asan-ubsan'
        run: ctest --test-dir build --output-on-failure -j "$(nproc)"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: omnivar-linux-x86_64
          path: static
      - name: Oncospan subset (-th ${{ matrix.threads }}), output equal to the static binary's
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
        run: |
          test -n "$ONCOSPAN_DIR" && test -n "$REFERENCE_FASTA" || { echo "set the ONCOSPAN_DIR and REFERENCE_FASTA repository secrets"; exit 1; }
          awk 'NR % 10 == 1' "$ONCOSPAN_DIR/target_roi_sorted_100bp_ex_pad.bed" > "$RUNNER_TEMP/subset.bed"
          args=(-G "$REFERENCE_FASTA" -b "$ONCOSPAN_DIR/Oncospan_DNA.realigned.bam" -N Oncospan_DNA
                -c 1 -S 2 -E 3 -g 4 -f 0.01 "$RUNNER_TEMP/subset.bed")
          chmod +x static/out/omnivar   # the artifact keeps the out/ prefix
          static/out/omnivar "${args[@]}" -th 16 > "$RUNNER_TEMP/static.vcf"
          build/omnivar "${args[@]}" -th ${{ matrix.threads }} > "$RUNNER_TEMP/sanitizer.vcf"
          cmp "$RUNNER_TEMP/static.vcf" "$RUNNER_TEMP/sanitizer.vcf"
          echo "$(grep -vc '^#' "$RUNNER_TEMP/sanitizer.vcf") records, identical to the static binary"
